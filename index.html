<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IronLog</title>
<meta name="description" content="Gym tracker: weekly routines, sets, reps, weights, PRs and body weight.">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D0E10" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IronLog">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/*
VOICE: a coach's logbook — direct, numeric, no fluff; built for sweaty thumbs between sets.
IDEA: competition bumper plates and the gym whiteboard: red 25s, blue 20s, chalk-white ground.
PICTURE: the live set table is the hero; a weight plate on Today shows the week (one segment per day).
COLOUR and TYPE: chalk/rubber ground, plate red for action, plate blue for "now", gold only for PRs; Barlow Condensed numbers like stamped plates, Barlow text.
LAYOUT: one phone column (max 640px), sticky header, bottom tab bar, bottom sheets, full-screen workout mode.
*/
:root{color-scheme:light dark;
--bg:light-dark(#F3F2EE,#0D0E10);--card:light-dark(#FFFFFF,#17191C);--card2:light-dark(#F6F5F1,#202226);
--ink:light-dark(#141518,#F1F1EF);--muted:light-dark(#5C616A,#9DA3AB);--line:light-dark(#E1DFD8,#2B2E33);
--red:#D7262B;--red-ink:light-dark(#B91D22,#FF6166);--red-soft:light-dark(#FBE4E4,#3A1416);
--blue:light-dark(#1D56CF,#6E9BFF);--blue-soft:light-dark(#E4ECFC,#14213D);
--gold:#F2B705;--gold-soft:light-dark(#FFF4C7,#332A04);--green:light-dark(#17864A,#3CCB7F);--green-soft:light-dark(#E1F4E8,#10291B);
--r:18px;--nav:66px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px);
--f:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fc:'Barlow Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 var(--f);overflow-x:clip}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
h2,h3{margin:0}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.i.s{width:18px;height:18px}
.sub{color:var(--muted);font-size:14px}
.grow{flex:1}
.num-f{font-family:var(--fc);font-variant-numeric:tabular-nums}

/* shell */
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top>div{max-width:640px;margin:0 auto;padding:calc(var(--st) + 12px) 16px 10px;display:flex;align-items:flex-end;gap:10px}
.top h1{font:700 34px/1 var(--fc);margin:0;flex:1}
.top h1 small{display:block;font:500 14px/1.3 var(--f);color:var(--muted);margin-bottom:2px}
main{max-width:640px;margin:0 auto;padding:6px 16px calc(var(--nav) + var(--sb) + 28px)}
.view{display:none}.view.on{display:block}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--sb)}
nav.tabs>div{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));height:var(--nav)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 12.5px var(--f);color:var(--muted)}
nav.tabs .pill{display:grid;place-items:center;width:56px;height:30px;border-radius:99px;transition:background .2s}
nav.tabs button.on{color:var(--ink)}nav.tabs button.on .pill{background:var(--red-soft);color:var(--red-ink)}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:none;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:var(--card2)}
.banner{margin:0 0 14px;padding:12px 14px;border-radius:14px;background:var(--blue-soft);font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner .i{color:var(--blue);margin-top:1px}

/* cards & controls */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:0 0 14px}
.card>h3,.sec{font:700 21px/1.15 var(--fc);margin:0 0 10px;display:flex;align-items:center;gap:8px}
.sec{margin:22px 2px 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);font-weight:600;font-size:15px;text-decoration:none}
.btn:active{filter:brightness(.95)}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.big{min-height:56px;width:100%;border-radius:14px;font:700 21px var(--fc);letter-spacing:.3px}
.btn.wide{width:100%}
.btn.ghost{background:none;border-color:transparent}
.btn.sm{min-height:38px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--red-ink)}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns>.btn{flex:1}
.in{width:100%;min-height:44px;border:1px solid var(--line);background:var(--card2);border-radius:11px;padding:8px 11px;font-size:16px}
.in:focus{border-color:var(--blue);outline:none;background:var(--card)}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
textarea.in{min-height:90px;resize:vertical}
label.f{display:block;font-size:14px;font-weight:600;color:var(--muted);margin:12px 0 6px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;margin:0 -16px;padding-inline:16px;scrollbar-width:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px;margin:0 0 14px}
.seg button{border:0;background:none;min-height:38px;border-radius:10px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted));flex:none}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--muted);white-space:nowrap}
.tag.pr{background:var(--gold-soft);color:light-dark(#7A5A00,#F7CF4A)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 22px var(--fc);margin-bottom:4px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:0 0 14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.kpi span{display:block;font-size:13px;color:var(--muted);font-weight:500}
.kpi b{display:block;font:700 28px/1.1 var(--fc);font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi small{font-size:13px;color:var(--muted);white-space:nowrap}
.up{color:var(--green)}.down{color:var(--red-ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;min-height:52px}
.li:last-child{border-bottom:0}
.li .t{font-weight:600}
.li .r{margin-left:auto;text-align:right;white-space:nowrap}

/* today */
.hero{padding:18px}
.hero .sub b{color:var(--ink)}
.hero h2{font:700 clamp(38px,11vw,52px)/1 var(--fc);margin:6px 0 14px;text-wrap:balance}
.plan{list-style:none;margin:0 0 16px;padding:0;counter-reset:p}
.plan li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:4px 10px;align-items:baseline;padding:9px 0;border-top:1px solid var(--line);counter-increment:p}
.plan li::before{content:counter(p);font:700 17px var(--fc);color:var(--muted)}
.plan li b{font:700 18px var(--fc);white-space:nowrap}
.plan li small{grid-column:2/4;color:var(--muted);font-size:13px;margin-top:-4px}
.okline{display:flex;gap:8px;align-items:center;color:var(--green);font-weight:600;margin:0 0 12px}
.alt{margin-top:14px}
.alt .sub{margin-bottom:8px}
.live{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-soft)}
.prog{height:8px;border-radius:9px;background:var(--card2);overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:9px}
.week{display:grid;grid-template-columns:128px minmax(0,1fr);gap:16px;align-items:center}
.week svg{width:128px;height:128px;display:block}
.week h3{font:700 21px var(--fc);margin:0 0 2px}
.week .big{font:700 34px/1 var(--fc)}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px;text-align:center;font:600 12px var(--f);color:var(--muted)}
.days i{display:block;width:22px;height:22px;margin:4px auto 0;border-radius:50%;border:2px solid var(--line)}
.days .d-done i{background:var(--red);border-color:var(--red)}
.days .d-plan i{border-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.days .d-today{color:var(--ink)}
.days .d-today i{box-shadow:0 0 0 3px var(--blue-soft);border-color:var(--blue)}
.days .d-today.d-done i{border-color:var(--red)}
.bw{display:flex;gap:14px;align-items:flex-end}
.bw .big{font:700 40px/1 var(--fc);font-variant-numeric:tabular-nums}
.bw svg{flex:1;height:48px}
.logrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;margin-top:14px}
.dr{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:8px;margin-top:10px}

/* workout */
#wo{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
#wo.on{display:flex}
.whead{background:var(--card);border-bottom:1px solid var(--line)}
.whead>div{max-width:640px;margin:0 auto;padding:calc(var(--st) + 8px) 8px 8px;display:flex;align-items:center;gap:6px}
.tin{border:0;background:none;font:700 23px/1.1 var(--fc);width:100%;padding:2px 4px;border-radius:8px}
.tin:focus{outline:none;background:var(--card2)}
#wo-clock{padding-left:4px;font-variant-numeric:tabular-nums}
.wbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.wbody>div{max-width:640px;margin:0 auto;padding:14px 10px 40px}
.ex{padding:12px 12px 6px}
.exh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.exn{font:700 22px/1.1 var(--fc)}
.hint{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--card2);margin:4px 0 8px}
.hint.go{background:var(--green-soft)}.hint.go .i{color:var(--green)}
.note{font-size:14px;color:var(--muted);margin:2px 0 8px;font-style:italic}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) 74px 62px 46px;gap:6px;align-items:center;padding:4px 0}
.rpe .row{grid-template-columns:30px 74px 60px 54px 46px}
.rpe .row .prev{display:none}
.row.h{font-size:12.5px;font-weight:600;color:var(--muted);padding:2px 0}
.row.h span:nth-child(n+3){text-align:center}
.sn{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--card2);font:700 16px var(--fc)}
.prev{font:500 15px var(--fc);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.numi{text-align:center;font:600 19px var(--fc);padding:6px 2px;font-variant-numeric:tabular-nums}
.numi::placeholder{color:color-mix(in srgb,var(--muted) 70%,transparent)}
.tick{width:46px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--card2);display:grid;place-items:center;color:var(--muted)}
.row.done .tick{background:var(--green);border-color:var(--green);color:#fff}
.row.done .in{background:var(--green-soft);border-color:transparent}
.row.pr .sn{background:var(--gold);color:#1a1400}
.exf{display:flex;gap:4px;justify-content:space-between;border-top:1px dashed var(--line);margin-top:6px;padding-top:4px}
.rest{background:var(--card);border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--sb))}
.rest>div{max-width:640px;margin:0 auto}
.rbar{height:6px;border-radius:6px;background:var(--card2);overflow:hidden;margin-bottom:8px}
.rbar i{display:block;height:100%;background:var(--blue);transition:width .25s linear}
.rrow{display:flex;align-items:center;gap:8px}
.rtime{flex:1;text-align:center;line-height:1}
.rtime b{display:block;font:700 34px var(--fc);font-variant-numeric:tabular-nums}
.rmsg{flex:1;font-size:14px;color:var(--muted)}
.rmsg.go{color:var(--green);font-weight:700;font-size:16px}

/* history */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cal .wd{font-size:12px;font-weight:600;color:var(--muted);padding-bottom:4px}
.cal button,.cal span.c{aspect-ratio:1;border:0;border-radius:12px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:600 15px var(--fc);max-height:52px;width:100%}
.cal .has{background:var(--red-soft);color:var(--red-ink)}
.cal .tod{box-shadow:inset 0 0 0 2px var(--blue)}
.cal .has i{width:6px;height:6px;border-radius:50%;background:var(--red)}
.calh{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.calh h3{flex:1;font:700 21px var(--fc)}
.sess{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.sess .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.sess .t b{font:700 21px/1.15 var(--fc)}
.sess .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.det{margin-bottom:12px}
.det h4{margin:0 0 4px;font:700 19px var(--fc);display:flex;gap:8px;align-items:center}
.det ol{margin:0;padding:0;list-style:none}
.det li{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.det li span:first-child{width:22px;color:var(--muted);font-family:var(--fc);font-weight:700}
.det li .e{margin-left:auto;color:var(--muted);font-size:14px}

/* progress */
.fig{position:relative;height:230px;margin:4px 0}
.fig svg{position:absolute;inset:0;touch-action:pan-y;overflow:visible}
.fig .gl{stroke:var(--line);stroke-width:1}
.fig .tk{fill:var(--muted);font:500 12px var(--f)}
.fig .cl{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;top:-6px;background:var(--ink);color:var(--bg);font-size:13px;font-weight:600;padding:5px 9px;border-radius:8px;white-space:nowrap;pointer-events:none;z-index:2}
.nochart{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px;text-align:center;padding:20px;border:1.5px dashed var(--line);border-radius:14px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:3px;border-radius:2px;background:var(--c)}
.legend i.d{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{font-size:13px;color:var(--muted);font-weight:600;text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:9px 4px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t .n{text-align:right;white-space:nowrap}
.mrow{display:grid;grid-template-columns:86px minmax(0,1fr) 56px;gap:10px;align-items:center;padding:6px 0}
.mrow .bars{display:flex;flex-direction:column;gap:3px}
.mrow .bars i{display:block;height:9px;border-radius:5px;background:var(--c);min-width:2px}
.mrow .bars i.l{opacity:.3}
.mrow .n{text-align:right;font:600 16px var(--fc);white-space:nowrap}
.goalbar{height:12px;border-radius:8px;background:var(--card2);overflow:hidden;margin:8px 0 4px}
.goalbar i{display:block;height:100%;background:var(--red);border-radius:8px}

/* plan */
.sched .li{cursor:pointer}
.sched .dn{width:44px;font:700 18px var(--fc)}
.rt{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px}
.rt b{font:700 22px var(--fc)}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 8px;padding:10px 0;border-bottom:1px solid var(--line);align-items:center}
.item .nm{font-weight:600}
.item .cfg{grid-column:1/3;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.item .cfg .in{width:58px;min-height:40px;text-align:center;padding:6px}
.item .mv{display:flex}
.item .mv .ib{width:38px;height:38px}
.daychips{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.daychips .chip{justify-content:center;padding:0}

/* sheets, toasts */
.scrim{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92dvh;overflow-y:auto;background:var(--card);border-radius:22px 22px 0 0;padding:6px 16px calc(22px + var(--sb));max-width:640px;margin:0 auto;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.sheet>.x{position:absolute;top:8px;right:8px;color:var(--muted)}
.sheet h2{padding-right:40px}.sheet h2:focus{outline:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h2{font:700 30px/1.05 var(--fc);margin:0 0 12px;text-wrap:balance}
.sheet .sub+.btns,.sheet .btns{margin-top:16px}
.sheet .stack>*+*{margin-top:8px}
.plist{margin-top:8px}
.plist .grp{font-size:13px;font-weight:700;color:var(--muted);margin:14px 0 2px}
.warn{background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.setg{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.setg .seg{margin:0}
.sw{position:relative;width:52px;height:32px;border-radius:99px;border:0;background:var(--line);flex:none}
.sw::after{content:'';position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgb(0 0 0/.3)}
.sw.on{background:var(--green)}.sw.on::after{transform:translateX(20px)}
#toasts{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--sb) + 12px);z-index:60;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
body.wo-open #toasts{bottom:calc(130px + var(--sb))}
body.sheet-open #toasts{bottom:auto;top:calc(var(--st) + 12px)}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:15px;font-weight:600;max-width:480px;box-shadow:0 6px 24px rgb(0 0 0/.25);display:flex;gap:10px;align-items:center;animation:up .25s}
.toast.pr{background:var(--gold);color:#1a1400}
@keyframes up{from{transform:translateY(100%);opacity:.4}}
@keyframes fade{from{opacity:0}}

<script>
{
/* ===== core: helpers, data, storage, stats ===== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ic = (n, c = '') => `<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const KEY = 'ironlog_v3', OLD_KEY = 'ironlog_gym_tracker_v2', LB = 2.20462, DAY = 864e5;
const MUSCLES = ['Chest', 'Back', 'Legs', 'Shoulders', 'Arms', 'Core', 'Full body', 'Cardio', 'Other'];
const MCOL = { Chest: '#D7262B', Back: '#1D56CF', Legs: '#E08600', Shoulders: '#17864A', Arms: '#8B5CF6', Core: '#64748B', 'Full body': '#0E9F9E', Cardio: '#DB2777', Other: '#78716C' };
const EQUIP = ['Barbell', 'Dumbbell', 'Machine', 'Cable', 'Bodyweight', 'Kettlebell', 'Other'];
const DOW = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const uid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const clone = o => JSON.parse(JSON.stringify(o));
const framed = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();

const LIB = [
  ['Barbell Bench Press', 'Chest', 'Barbell'], ['Dumbbell Bench Press', 'Chest', 'Dumbbell'], ['Incline Barbell Bench Press', 'Chest', 'Barbell'],
  ['Incline Dumbbell Press', 'Chest', 'Dumbbell'], ['Machine Chest Press', 'Chest', 'Machine'], ['Cable Fly', 'Chest', 'Cable'],
  ['Pec Deck', 'Chest', 'Machine'], ['Dumbbell Fly', 'Chest', 'Dumbbell'], ['Dips', 'Chest', 'Bodyweight'], ['Push-Ups', 'Chest', 'Bodyweight'],
  ['Deadlift', 'Back', 'Barbell'], ['Pull-Ups', 'Back', 'Bodyweight'], ['Chin-Ups', 'Back', 'Bodyweight'], ['Lat Pulldown', 'Back', 'Cable'],
  ['Barbell Row', 'Back', 'Barbell'], ['Dumbbell Row', 'Back', 'Dumbbell'], ['Seated Cable Row', 'Back', 'Cable'], ['T-Bar Row', 'Back', 'Barbell'],
  ['Back Squat', 'Legs', 'Barbell'], ['Front Squat', 'Legs', 'Barbell'], ['Leg Press', 'Legs', 'Machine'], ['Romanian Deadlift', 'Legs', 'Barbell'],
  ['Bulgarian Split Squat', 'Legs', 'Dumbbell'], ['Walking Lunge', 'Legs', 'Dumbbell'], ['Leg Extension', 'Legs', 'Machine'], ['Leg Curl', 'Legs', 'Machine'],
  ['Hip Thrust', 'Legs', 'Barbell'], ['Standing Calf Raise', 'Legs', 'Machine'], ['Hack Squat', 'Legs', 'Machine'],
  ['Overhead Press', 'Shoulders', 'Barbell'], ['Dumbbell Shoulder Press', 'Shoulders', 'Dumbbell'], ['Lateral Raise', 'Shoulders', 'Dumbbell'],
  ['Cable Lateral Raise', 'Shoulders', 'Cable'], ['Rear Delt Fly', 'Shoulders', 'Dumbbell'], ['Face Pull', 'Shoulders', 'Cable'], ['Shrugs', 'Shoulders', 'Dumbbell'],
  ['Barbell Curl', 'Arms', 'Barbell'], ['Dumbbell Curl', 'Arms', 'Dumbbell'], ['Hammer Curl', 'Arms', 'Dumbbell'], ['Preacher Curl', 'Arms', 'Machine'],
  ['Tricep Pushdown', 'Arms', 'Cable'], ['Overhead Tricep Extension', 'Arms', 'Cable'], ['Skull Crusher', 'Arms', 'Barbell'], ['Close-Grip Bench Press', 'Arms', 'Barbell'],
  ['Hanging Leg Raise', 'Core', 'Bodyweight'], ['Cable Crunch', 'Core', 'Cable'], ['Ab Wheel Rollout', 'Core', 'Other'], ['Russian Twist', 'Core', 'Bodyweight'],
];
// Old IronLog (v2) names -> new library names
const ALIAS = {
  'barbell deadlift': 'Deadlift', 'barbell back squat': 'Back Squat', 'overhead barbell press': 'Overhead Press', 'bent-over barbell row': 'Barbell Row',
  'barbell bicep curl': 'Barbell Curl', 'dumbbell chest fly': 'Dumbbell Fly', 'weighted dips': 'Dips', 'cable crossover': 'Cable Fly',
  'lying leg curl': 'Leg Curl', 'dumbbell lateral raise': 'Lateral Raise', 'cable face pull': 'Face Pull', 'tricep rope pushdown': 'Tricep Pushdown',
  'ez-bar skullcrusher': 'Skull Crusher', 'chest press': 'Machine Chest Press', 'dumbbell chest press': 'Dumbbell Bench Press', 'bench press': 'Barbell Bench Press',
  'squat': 'Back Squat', 'ohp': 'Overhead Press',
};
// The weekly plan you start with (editable in Plan)
const ROUTINES = [
  { name: 'Chest Day', day: 0, items: [['Barbell Bench Press', 4, 6, 8], ['Dumbbell Bench Press', 3, 8, 10], ['Incline Dumbbell Press', 3, 8, 12], ['Machine Chest Press', 3, 10, 12], ['Cable Fly', 3, 12, 15]] },
  { name: 'Back Day', day: 1, items: [['Deadlift', 3, 5, 5], ['Pull-Ups', 3, 6, 10], ['Barbell Row', 3, 8, 10], ['Lat Pulldown', 3, 10, 12], ['Seated Cable Row', 3, 10, 12]] },
  { name: 'Leg Day', day: 2, items: [['Back Squat', 4, 5, 8], ['Romanian Deadlift', 3, 8, 10], ['Leg Press', 3, 10, 12], ['Leg Curl', 3, 10, 12], ['Standing Calf Raise', 4, 12, 15]] },
  { name: 'Shoulder Day', day: 3, items: [['Overhead Press', 4, 6, 8], ['Dumbbell Shoulder Press', 3, 8, 10], ['Lateral Raise', 4, 12, 15], ['Rear Delt Fly', 3, 12, 15], ['Shrugs', 3, 10, 12]] },
  { name: 'Arm Day', day: 4, items: [['Barbell Curl', 3, 8, 10], ['Close-Grip Bench Press', 3, 8, 10], ['Hammer Curl', 3, 10, 12], ['Tricep Pushdown', 3, 10, 12], ['Hanging Leg Raise', 3, 10, 15]] },
];

function freshState() {
  const ex = LIB.map(([n, m, q]) => ({ id: slug(n), n, m, q }));
  const routines = ROUTINES.map(r => ({ id: 'r-' + slug(r.name), name: r.name, items: r.items.map(([n, s, lo, hi]) => ({ ex: slug(n), s, lo, hi })) }));
  const sched = Array(7).fill(null);
  ROUTINES.forEach((r, i) => { sched[r.day] = routines[i].id; });
  return { v: 3, unit: 'kg', rest: 90, inc: { kg: 2.5, lbs: 5 }, rpe: false, sound: true, vib: true, ex, routines, sched, sessions: [], bw: [], goals: {}, bwGoal: null, active: null, seen: false };
}

/* storage: localStorage with an in-memory fallback */
let mem = {}, storeOK = true;
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { storeOK = false; return mem[k] ?? null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) { storeOK = false; mem[k] = v; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { delete mem[k]; } },
};
let S, dirty = true, saveT = 0;
function load() {
  const raw = store.get(KEY);
  if (raw) { try { S = Object.assign(freshState(), JSON.parse(raw)); return; } catch (e) { console.warn('Bad saved data', e); } }
  S = freshState();
}
function save() { dirty = true; clearTimeout(saveT); saveT = 0; store.set(KEY, JSON.stringify(S)); }
function saveSoon() { dirty = true; clearTimeout(saveT); saveT = setTimeout(save, 350); }

/* units & formatting (weights are stored in kg) */
const U = () => S.unit;
const toD = kg => (S.unit === 'lbs' ? kg * LB : kg);
const toKg = v => (S.unit === 'lbs' ? v / LB : v);
const r1 = n => Math.round(n * 10) / 10;
const fw = kg => String(r1(toD(kg || 0)));
const fnum = n => Math.round(n).toLocaleString('en-GB');
const fk = n => (Math.abs(n) >= 10000 ? (n / 1000).toFixed(Math.abs(n) >= 100000 ? 0 : 1) + 'k' : fnum(n));
const incKg = () => toKg(S.inc[S.unit] || (S.unit === 'kg' ? 2.5 : 5));
const pnum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const e1 = (w, r) => (!(w > 0) || !(r > 0) ? 0 : r === 1 ? w : w * (1 + r / 30));
const rr = it => (it.lo === it.hi ? `${it.lo}` : `${it.lo}–${it.hi}`);
const setTxt = t => (t.w > 0 ? `${fw(t.w)}×${t.r}` : `${t.r} reps`);

/* dates */
const iso = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const pd = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const dow = d => (d.getDay() + 6) % 7;
const addDays = (s, n) => { const d = pd(s); d.setDate(d.getDate() + n); return iso(d); };
const monday = s => addDays(s, -dow(pd(s)));
const fdate = (s, o = { weekday: 'short', day: 'numeric', month: 'short' }) => pd(s).toLocaleDateString('en-GB', o);
const dur = ms => { const m = Math.max(1, Math.round(ms / 6e4)); return m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, '0')}` : `${m} min`; };
const clock = s => { s = Math.max(0, Math.ceil(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

/* exercises */
const EX = id => S.ex.find(e => e.id === id) || { id, n: id, m: 'Other', q: 'Other' };
function exByName(name) {
  const n = String(name).trim(), low = n.toLowerCase();
  const target = (ALIAS[low] || n).toLowerCase();
  return S.ex.find(e => e.n.toLowerCase() === target) || S.ex.find(e => e.n.toLowerCase() === low);
}
function addExercise(n, m = 'Other', q = 'Other') {
  const found = exByName(n); if (found) { found.hide = false; return found; }
  let id = slug(n) || uid('ex'); if (S.ex.some(e => e.id === id)) id = uid(id);
  n = n.trim(); if (n === n.toLowerCase()) n = n.replace(/(^|[\s-])\S/g, c => c.toUpperCase());
  const e = { id, n, m: MUSCLES.includes(m) ? m : 'Other', q, c: true }; S.ex.push(e); return e;
}

/* stats: per-exercise bests and the PRs each session set (cached until data changes) */
const cmpS = (a, b) => a.date.localeCompare(b.date) || (a.start || 0) - (b.start || 0);
function entryBest(e) {
  const b = { e1: 0, w: 0, r: 0, rw: 0, vol: 0, n: 0, top: null };
  for (const t of e.sets) {
    if (!t.done) continue; b.n++;
    const v = e1(t.w, t.r); if (v > b.e1) b.e1 = v;
    if ((t.w || 0) > b.w || (b.top && (t.w || 0) === b.w && t.r > b.top.r)) { b.w = t.w || 0; b.top = t; }
    if (!b.top) b.top = t;
    if (!(t.w > 0)) b.rw = Math.max(b.rw, t.r || 0);
    b.r = Math.max(b.r, t.r || 0); b.vol += (t.w || 0) * (t.r || 0);
  }
  return b;
}
let ST = null;
function stats() {
  if (!dirty && ST) return ST;
  const ss = [...S.sessions].sort(cmpS), best = {}, prs = {};
  for (const s of ss) {
    const list = [];
    for (const e of s.ex) {
      const x = entryBest(e); if (!x.n) continue;
      const b = best[e.ex];
      if (b) {
        if (x.e1 > b.e1 + 1e-6) list.push({ ex: e.ex, t: 'e1', v: x.e1, set: x.top });
        else if (x.w > b.w + 1e-6) list.push({ ex: e.ex, t: 'w', v: x.w, set: x.top });
        else if (x.w === 0 && x.rw > b.rw) list.push({ ex: e.ex, t: 'r', v: x.rw });
        b.e1 = Math.max(b.e1, x.e1); b.w = Math.max(b.w, x.w); b.rw = Math.max(b.rw, x.rw); b.n += 1; b.last = s.date;
      } else best[e.ex] = { e1: x.e1, w: x.w, rw: x.rw, n: 1, first: s.date, last: s.date };
    }
    prs[s.id] = list;
  }
  ST = { ss, best, prs }; dirty = false; return ST;
}
const prText = p => (p.t === 'e1' ? `est. 1RM ${fw(p.v)} ${U()}` : p.t === 'w' ? `heaviest ${fw(p.v)} ${U()}` : `${p.v} reps`);
function sessVol(s) { let v = 0, n = 0; for (const e of s.ex) for (const t of e.sets) if (t.done) { v += (t.w || 0) * (t.r || 0); n++; } return { v, n }; }
function bestExcluding(exId, excl) {
  const b = { e1: 0, w: 0, rw: 0, has: false };
  for (const s of S.sessions) {
    if (s.id === excl) continue;
    for (const e of s.ex) if (e.ex === exId) { const x = entryBest(e); if (!x.n) continue; b.has = true; b.e1 = Math.max(b.e1, x.e1); b.w = Math.max(b.w, x.w); b.rw = Math.max(b.rw, x.rw); }
  }
  return b;
}
function lastPerf(exId, excl) {
  const ss = stats().ss;
  for (let i = ss.length - 1; i >= 0; i--) {
    const s = ss[i]; if (s.id === excl) continue;
    for (const e of s.ex) if (e.ex === exId) { const sets = e.sets.filter(t => t.done); if (sets.length) return { date: s.date, sets }; }
  }
  return null;
}
/* progressive overload: hit the top of the rep range on every set -> add one increment */
function suggestion(exId, item, excl) {
  const lp = lastPerf(exId, excl); if (!lp) return { lp: null, up: false, sets: [] };
  const top = Math.max(...lp.sets.map(t => t.w || 0));
  const up = !!(item && item.hi && top > 0 && lp.sets.length >= item.s && lp.sets.every(t => t.r >= item.hi));
  const sets = lp.sets.map(t => (up ? { w: top + incKg(), r: item.lo } : { w: t.w || 0, r: t.r }));
  return { lp, up, top, sets };
}

/* ===== charts (hand-drawn SVG, no libraries, work offline) ===== */
let ROs = [];
const clearCharts = () => { ROs.forEach(r => r.disconnect()); ROs = []; };
const nice = v => { if (!(v > 0)) return 1; const p = 10 ** Math.floor(Math.log10(v)), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
const tickTxt = v => (Math.abs(v) >= 10000 ? r1(v / 1000) + 'k' : String(r1(v)));
const shortD = x => new Date(x).toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

function observe(el, draw) { const ro = new ResizeObserver(() => draw()); ro.observe(el); ROs.push(ro); }

/* series: [{pts:[{x,y,...}], c, dash, area, line, dots, w}] ; tip(point) -> text */
function lineChart(el, series, o = {}) {
  const draw = () => {
    const W = el.clientWidth, H = el.clientHeight; if (!W || !H) return;
    const pts = series.flatMap(s => s.pts);
    if (!pts.length) { el.innerHTML = `<div class="nochart">${o.empty || 'No data in this range yet'}</div>`; return; }
    const small = W < 420, P = { l: small ? 38 : 46, r: 12, t: 30, b: 26 };
    let x0 = Math.min(...pts.map(p => p.x)), x1 = Math.max(...pts.map(p => p.x));
    if (x1 - x0 < DAY * 2) { x0 -= DAY * 3; x1 += DAY * 3; }
    let y0 = Math.min(...pts.map(p => p.y)), y1 = Math.max(...pts.map(p => p.y));
    let sp = y1 - y0; if (sp < 1e-9) sp = Math.max(1, Math.abs(y1) * 0.1);
    y0 -= sp * 0.15; y1 += sp * 0.15; if (o.zero || y0 < 0) y0 = Math.max(0, y0);
    const st = nice((y1 - y0) / (small ? 3 : 4)); y0 = Math.floor(y0 / st) * st; y1 = Math.ceil(y1 / st) * st; if (y1 === y0) y1 = y0 + st;
    const X = x => P.l + (x - x0) / (x1 - x0) * (W - P.l - P.r), Y = y => H - P.b - (y - y0) / (y1 - y0) * (H - P.t - P.b);
    let g = '';
    for (let v = y0; v <= y1 + st / 2; v += st) { const yy = Y(v).toFixed(1); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" class="gl"/><text x="${P.l - 7}" y="${+yy + 4}" class="tk" text-anchor="end">${tickTxt(v)}</text>`; }
    const nx = small ? 3 : 4;
    for (let i = 0; i < nx; i++) { const x = x0 + (x1 - x0) * i / (nx - 1); g += `<text x="${X(x).toFixed(1)}" y="${H - 6}" class="tk" text-anchor="${i === 0 ? 'start' : i === nx - 1 ? 'end' : 'middle'}">${shortD(x)}</text>`; }
    let body = '';
    for (const s of series) {
      const ps = [...s.pts].sort((a, b) => a.x - b.x); if (!ps.length) continue;
      const d = ps.map((p, i) => (i ? 'L' : 'M') + X(p.x).toFixed(1) + ',' + Y(p.y).toFixed(1)).join('');
      if (s.area) body += `<path d="${d}L${X(ps.at(-1).x).toFixed(1)},${H - P.b}L${X(ps[0].x).toFixed(1)},${H - P.b}Z" fill="${s.c}" opacity=".1"/>`;
      if (s.line !== false && ps.length > 1) body += `<path d="${d}" fill="none" stroke="${s.c}" stroke-width="${s.w || 2.5}" ${s.dash ? 'stroke-dasharray="6 5"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`;
      if (s.dots !== false) body += ps.map(p => `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${s.r || (ps.length > 40 ? 2.5 : 3.6)}" fill="${s.fill || 'var(--card)'}" stroke="${s.c}" stroke-width="2"/>`).join('');
    }
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.label || 'Chart')}">${g}${body}<g class="cur"></g></svg><div class="tip" hidden></div>`;
    if (!o.tip) return;
    const svg = el.querySelector('svg'), cur = svg.querySelector('.cur'), tip = el.querySelector('.tip');
    const main = [...series[o.tipSeries || 0].pts].sort((a, b) => a.x - b.x);
    const pick = ev => {
      const r = svg.getBoundingClientRect(), mx = ev.clientX - r.left; let best = null, bd = 1e9;
      for (const p of main) { const dd = Math.abs(X(p.x) - mx); if (dd < bd) { bd = dd; best = p; } }
      if (!best) return; const xx = X(best.x);
      cur.innerHTML = `<line x1="${xx}" x2="${xx}" y1="${P.t - 6}" y2="${H - P.b}" class="cl"/>` + series.map(s => { const q = s.pts.find(p => p.x === best.x); return q ? `<circle cx="${xx}" cy="${Y(q.y)}" r="5.5" fill="${s.c}"/>` : ''; }).join('');
      tip.hidden = false; tip.textContent = o.tip(best);
      const tw = tip.offsetWidth; tip.style.left = Math.min(Math.max(0, xx - tw / 2), W - tw) + 'px';
    };
    svg.addEventListener('pointerdown', pick);
    svg.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'mouse') pick(e); });

}

/* bars: [{label, v, on}] */
function barChart(el, bars, o = {}) {
  const draw = () => {
    const W = el.clientWidth, H = el.clientHeight; if (!W || !H) return;
    if (!bars.some(b => b.v > 0)) { el.innerHTML = `<div class="nochart">${o.empty || 'Nothing logged yet'}</div>`; return; }
    const small = W < 420, P = { l: small ? 38 : 46, r: 6, t: 30, b: 26 };
    const max = Math.max(...bars.map(b => b.v)), st = nice(max / 3), y1 = Math.ceil(max / st) * st || 1;
    const Y = y => H - P.b - y / y1 * (H - P.t - P.b), bw = (W - P.l - P.r) / bars.length;
    let g = '';
    for (let v = 0; v <= y1 + st / 2; v += st) { const yy = Y(v).toFixed(1); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" class="gl"/><text x="${P.l - 7}" y="${+yy + 4}" class="tk" text-anchor="end">${tickTxt(v)}</text>`; }
    const every = Math.ceil(bars.length / (small ? 4 : 6));
    const body = bars.map((b, i) => {
      const x = P.l + i * bw + bw * 0.18, w = bw * 0.64, y = Y(b.v), h = H - P.b - y;
      const lab = (bars.length - 1 - i) % every === 0 ? `<text x="${(x + w / 2).toFixed(1)}" y="${H - 6}" class="tk" text-anchor="middle">${esc(b.label)}</text>` : '';
      return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0, h).toFixed(1)}" rx="${Math.min(5, w / 3)}" fill="${b.on ? 'var(--red)' : 'color-mix(in srgb,var(--red) 38%,var(--card))'}"><title>${esc(b.label)}: ${fnum(b.v)}</title></rect>${lab}`;
    }).join('');
    el.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="${esc(o.label || 'Bar chart')}">${g}${body}</svg><div class="tip" hidden></div>`;
    if (!o.tip) return;
    const svg = el.querySelector('svg'), tip = el.querySelector('.tip');
    svg.addEventListener('pointerdown', ev => {
      const r = svg.getBoundingClientRect(), i = Math.floor((ev.clientX - r.left - P.l) / bw); const b = bars[i]; if (!b) return;
      tip.hidden = false; tip.textContent = o.tip(b); const tw = tip.offsetWidth, cx = P.l + i * bw + bw / 2;
      tip.style.left = Math.min(Math.max(0, cx - tw / 2), W - tw) + 'px';
    });
  };
  observe(el, draw); draw();
}

function sparkline(vals, c = 'var(--red)') {
  if (vals.length < 2) return '<svg></svg>';
  const lo = Math.min(...vals), hi = Math.max(...vals), sp = hi - lo || 1;
  const d = vals.map((v, i) => (i ? 'L' : 'M') + (i / (vals.length - 1) * 100).toFixed(2) + ',' + (30 - (v - lo) / sp * 26).toFixed(2)).join('');
  return `<svg viewBox="0 0 100 32" preserveAspectRatio="none" aria-hidden="true"><path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

/* the week as a bumper plate: one segment per weekday */
function weekPlate(days) {
  const cx = 64, cy = 64, R = 61, r2 = 39, gap = 4;
  const arc = (a0, a1, ro, ri) => {
    const p = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)].map(n => n.toFixed(2)).join(',');
    const lg = a1 - a0 > 180 ? 1 : 0;
    return `M${p(a0, ro)}A${ro},${ro} 0 ${lg} 1 ${p(a1, ro)}L${p(a1, ri)}A${ri},${ri} 0 ${lg} 0 ${p(a0, ri)}Z`;
  };
  const segs = days.map((d, i) => {
    const a0 = i * 360 / 7 + gap / 2, a1 = (i + 1) * 360 / 7 - gap / 2;
    const fill = d.done ? '#D7262B' : d.today && d.sched ? '#2F6BE8' : d.sched ? '#4A4D55' : '#2A2C31';
    return `<path d="${arc(a0, a1, R - 5, r2 + 3)}" fill="${fill}"><title>${DOW[i]}: ${d.done ? 'trained' : d.sched ? 'planned' : 'rest'}</title></path>`;
  }).join('');
  return `<svg viewBox="0 0 128 128" role="img" aria-label="This week as a plate: ${days.filter(d => d.done).length} days trained">
    <circle cx="${cx}" cy="${cy}" r="${R + 2}" fill="#141518"/><circle cx="${cx}" cy="${cy}" r="${R + 1.5}" fill="none" stroke="#33363C" stroke-width="1.5"/>
    ${segs}
    <circle cx="${cx}" cy="${cy}" r="${r2}" fill="#1B1D21"/>
    <circle cx="${cx}" cy="${cy}" r="25" fill="#BFC3C9"/><circle cx="${cx}" cy="${cy}" r="25" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.2" stroke-dasharray="40 200"/>
    <circle cx="${cx}" cy="${cy}" r="19" fill="#8E939B"/><circle cx="${cx}" cy="${cy}" r="13" fill="var(--card)"/>
  </svg>`;
}

function exSeries(exId) {

  const firstV = rows.length ? (weighted ? rows[0].b.e1 : rows[0].b.r) : 0, lastV = rows.length ? (weighted ? rows.at(-1).b.e1 : rows.at(-1).b.r) : 0;
  const ch = rows.length > 1 ? (weighted ? toD(lastV) - toD(firstV) : lastV - firstV) : null;
  const goal = S.goals[pEx];
  let h = `<label class="f" for="pex">Exercise</label><select id="pex" class="in" data-chg="pex">${used.map(id => `<option value="${id}" ${id === pEx ? 'selected' : ''}>${esc(EX(id).n)} (${st.best[id].n})</option>`).join('')}</select>
    <div class="kpis" style="margin-top:14px">

/* placeholders: last time's numbers (or +1 increment when you earned it), following today's weight once you change it */
function placeholders(e) {
  const sg = suggestion(e.ex, e.item, S.active.editing);
  return e.sets.map((t, j) => {
    let p = sg.sets[j] || sg.sets.at(-1); p = p ? { ...p } : { w: null, r: e.item ? e.item.lo : null };
    let k = j - 1; while (k >= 0 && !e.sets[k].done) k--;
    const prev = k >= 0 ? e.sets[k] : null;
    if (prev) {
      const ps = sg.sets[k];
      if (!ps || Math.abs((ps.w || 0) - (prev.w || 0)) > 1e-6) p.w = prev.w;
      if (!ps) p.r = prev.r;
    }
    return p;
  });
}
function exCard(e, i) {

  else if (!sg.lp && !a.editing) hint = `<div class="hint">${ic('info', 's')}<span>First time logging this${e.item ? ` — pick a weight you can lift for ${rr(e.item)} clean reps` : ''}.</span></div>`;

/* fill a set from its placeholder; returns an error message or '' */
function fillSet(e, j) {
  const t = e.sets[j], p = placeholders(e)[j];
  const w = t.w != null ? t.w : p.w, r = t.r != null ? t.r : p.r;
  if (!(r > 0)) return 'Enter the reps first';
  if (w == null) { if (EX(e.ex).q === 'Bodyweight') { t.w = 0; } else return 'Enter the weight first'; } else t.w = w;
  t.r = r; t.done = true; return '';
}
function tick(i, j) {
  audioInit();
  const a = S.active, e = a.ex[i], t = e.sets[j];
  if (t.done) { t.done = false; t.pr = false; save(); renderCard(i); woClock(); return; }
  const err = fillSet(e, j);
  if (err) { toast(err); const inp = $(`#wo-list .row[data-i="${i}"][data-j="${j}"] [data-f="${err.includes('reps') ? 'r' : 'w'}"]`); inp && inp.focus(); return; }
  // PR check against history and earlier sets today
  const hb = bestExcluding(e.ex, a.editing || a.id), others = e.sets.filter((s, k) => k !== j && s.done);
  const ce1 = Math.max(0, ...others.map(s => e1(s.w, s.r))), cw = Math.max(0, ...others.map(s => s.w || 0)), cr = Math.max(0, ...others.filter(s => !(s.w > 0)).map(s => s.r));
  const v = e1(t.w, t.r); let msg = '';
  if (hb.has) {
    if (v > 0 && v > Math.max(hb.e1, ce1) + 1e-6) msg = `est. 1RM ${fw(v)} ${U()}`;
    else if (t.w > Math.max(hb.w, cw) + 1e-6) msg = `heaviest ever, ${fw(t.w)} ${U()}`;
    else if (!(t.w > 0) && t.r > Math.max(hb.rw, cr)) msg = `${t.r} reps`;
  }
  t.pr = !!msg;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  save(); renderCard(i); woClock();
  if (msg) { toast(`New PR · ${EX(e.ex).n} — ${msg}`, 'pr'); buzz([60, 50, 60]); } else buzz(25);
  if (!a.editing) startRest(S.rest);
}

/* rest timer (timestamp based: keeps time while the screen is off) */
function audioInit() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { } }
function beep() {
  if (!S.sound || !actx) return;
  try {
    const t0 = actx.currentTime;
    [0, 0.22, 0.44].forEach((d, k) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.value = k === 2 ? 1320 : 880; g.gain.setValueAtTime(0.0001, t0 + d); g.gain.exponentialRampToValueAtTime(0.3, t0 + d + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + d + 0.18); o.connect(g); g.connect(actx.destination); o.start(t0 + d); o.stop(t0 + d + 0.2); });
  } catch (e) { }
}
const buzz = p => { if (S.vib && navigator.vibrate) try { navigator.vibrate(p); } catch (e) { } };
function startRest(sec) { audioInit(); R.total = sec; R.end = Date.now() + sec * 1000; R.msg = ''; if (S.active) { S.active.rest = { end: R.end, total: sec }; saveSoon(); } loopRest(); }
function loopRest() { clearInterval(R.iv); if (R.end) R.iv = setInterval(renderRest, 250); renderRest(true); }
function stopRest(msg = '') { R.end = 0; R.msg = msg; clearInterval(R.iv); if (S.active) { S.active.rest = null; saveSoon(); } renderRest(true); }
function renderRest(force) {
  const el = $('#rest'); if (!el) return;
  let left = R.end ? (R.end - Date.now()) / 1000 : 0;
  if (R.end && left <= 0) { beep(); buzz([300, 120, 300, 120, 300]); stopRest('Rest over — time for your next set'); return; }
  const mode = R.end ? 'run' : 'idle';
  if (force || mode !== R.mode) {
    R.mode = mode;
    el.innerHTML = mode === 'run'
      ? `<div class="rbar"><i id="rfill"></i></div><div class="rrow"><button class="btn sm" data-act="rest-adj" data-d="-15" aria-label="15 seconds less">−15</button><div class="rtime"><span class="sub">Rest</span><b id="rtime"></b></div><button class="btn sm" data-act="rest-adj" data-d="15" aria-label="15 seconds more">+15</button><button class="btn sm" data-act="rest-skip">Skip</button></div>`
      : `<div class="rrow">${ic('timer')}<span class="rmsg ${R.msg ? 'go' : ''}">${R.msg || 'Rest'}</span>${[60, 90, 120, 180].map(s => `<button class="btn sm" data-act="rest-start" data-s="${s}">${s < 120 ? s + 's' : s / 60 + 'm'}</button>`).join('')}</div>`;
  }
  if (mode === 'run') { const f = $('#rfill'), tt = $('#rtime'); if (tt) tt.textContent = clock(left); if (f) f.style.width = Math.max(0, Math.min(100, left / R.total * 100)) + '%'; }
}

  const a = S.active; let n = 0, v = 0, pend = 0, prs = 0;
  for (const e of a.ex) for (const t of e.sets) { if (t.done) { n++; v += (t.w || 0) * (t.r || 0); if (t.pr) prs++; } else if (t.w != null || t.r != null) pend++; }
  return { n, v, pend, prs };
}

    ${T.n ? '' : `<div class="warn">No sets ticked yet — there is nothing to save.</div>`}

function saveWorkout() {
  const a = S.active; if (!a) return;

  const s = { id: a.editing || a.id, name: (a.name || '').trim() || 'Workout', routine: a.routine, date, start: a.start, end: a.editing ? a.end : Date.now(),

  if (a.demo) s.demo = true;

/* ===== bottom sheets (Android back button closes them) ===== */
const stack = [];
const SHEET_TOP = `<div class="grab"></div><button class="ib x" data-act="close" aria-label="Close">${ic('x')}</button>`;
let popWait = null, popTimer = 0;
function sheet(html, o = {}) {
  const scrim = document.createElement('div'); scrim.className = 'scrim'; scrim.dataset.act = 'close';
  const el = document.createElement('div'); el.className = 'sheet'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true');
  el.innerHTML = SHEET_TOP + html;
  $('#layer').append(scrim, el);
  let p = false; try { history.pushState({ sheet: stack.length + 1 }, ''); p = true; } catch (e) { }
  stack.push({ el, scrim, p, o }); syncLock();
  const h = el.querySelector('h2'); if (h) { h.tabIndex = -1; h.focus({ preventScroll: true }); }
  return el;
}
function setSheet(html) { const t = stack.at(-1); if (!t) return; const sc = t.el.scrollTop; t.el.innerHTML = SHEET_TOP + html; t.el.scrollTop = sc; }
function popDom() { const t = stack.pop(); if (!t) return null; t.el.remove(); t.scrim.remove(); syncLock(); if (t.o.onClose) t.o.onClose(); return t; }
function closeSheets(n = 1, then) {
  let back = 0; while (n-- > 0 && stack.length) { if (popDom().p) back++; }
  if (!back) { then && then(); return; }
  const prev = popWait; popWait = { then: () => { prev && prev.then(); then && then(); } };
  clearTimeout(popTimer); popTimer = setTimeout(() => { if (popWait) { const f = popWait.then; popWait = null; f(); } }, 450);
  history.go(-back);
}
window.addEventListener('popstate', () => {
  if (popWait) { clearTimeout(popTimer); const f = popWait.then; popWait = null; f(); return; }
  if (stack.length) popDom();
});
function confirmDlg(title, msg, ok, fn, danger = true) {
  sheet(`<h2>${esc(title)}</h2><p class="sub">${esc(msg)}</p><div class="btns"><button class="btn" data-act="close">Cancel</button><button class="btn ${danger ? 'pri' : 'blue'}" data-act="confirm-ok">${esc(ok)}</button></div>`, { ok: fn });
}
function toast(msg, kind = '') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status');
  t.innerHTML = (kind === 'pr' ? ic('trophy') : '') + `<span>${esc(msg)}</span>`; $('#toasts').append(t);
  setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 320); }, kind === 'pr' ? 3600 : 2600);
}

/* exercise picker (search, filter, create) */
function picker(onPick, title = 'Add exercise') {
  let q = '', mf = 'All';
  const el = sheet(`<h2>${esc(title)}</h2><input class="in" id="pk-q" placeholder="Search, or type a new exercise" autocomplete="off" aria-label="Search exercises">

  const list = $('#pk-list', el);
  const draw = () => {
    const ql = q.trim().toLowerCase();
    const items = S.ex.filter(e => !e.hide && (mf === 'All' || e.m === mf) && (!ql || e.n.toLowerCase().includes(ql))).sort((a, b) => MUSCLES.indexOf(a.m) - MUSCLES.indexOf(b.m) || a.n.localeCompare(b.n));
    let h = '';
    if (ql && !S.ex.some(e => !e.hide && e.n.toLowerCase() === ql)) h += `<button class="li" data-pnew="1">${ic('plus')}<div><div class="t">Create “${esc(q.trim())}”</div><div class="sub">Add it to your library</div></div></button>`;
    let g = '';
    for (const e of items) { if (e.m !== g) { g = e.m; h += `<div class="grp">${g}</div>`; } h += `<button class="li" data-pick="${e.id}"><span class="dot" style="--c:${MCOL[e.m]}"></span><div><div class="t">${esc(e.n)}</div><div class="sub">${esc(e.q)}${e.c ? ' · yours' : ''}</div></div></button>`; }
    if (!items.length && !ql) h += '<div class="empty">No exercises in this group yet.</div>';
    list.innerHTML = h;
  };
  $('#pk-q', el).addEventListener('input', ev => { q = ev.target.value; draw(); });
  el.addEventListener('click', ev => {
    const c = ev.target.closest('[data-pm]'); if (c) { mf = c.dataset.pm; $$('[data-pm]', el).forEach(b => b.classList.toggle('on', b === c)); draw(); return; }
    const p = ev.target.closest('[data-pick]'); if (p) { const id = p.dataset.pick; closeSheets(1, () => onPick(id)); return; }
    if (ev.target.closest('[data-pnew]')) {
      list.innerHTML = `<div class="card" style="margin-top:12px"><h3>New exercise</h3><label class="f" for="nx-n">Name</label><input id="nx-n" class="in" value="${esc(q.trim())}" maxlength="60">
        <label class="f" for="nx-m">Muscle group</label><select id="nx-m" class="in">${MUSCLES.map(m => `<option ${m === (mf === 'All' ? 'Chest' : mf) ? 'selected' : ''}>${m}</option>`).join('')}</select>
        <label class="f" for="nx-q">Equipment</label><select id="nx-q" class="in">${EQUIP.map(m => `<option>${m}</option>`).join('')}</select>
        <button class="btn pri wide" style="margin-top:14px" data-pcreate="1">Create and add</button></div>`;
      return;
    }
    if (ev.target.closest('[data-pcreate]')) {
      const n = $('#nx-n', el).value.trim(); if (!n) { toast('Give it a name'); return; }
      const x = addExercise(n, $('#nx-m', el).value, $('#nx-q', el).value); save();
      closeSheets(1, () => { onPick(x.id); toast(`Added “${x.n}” to your library`); });
    }
  });
  draw();
}

/* returns 'saved' | 'declined' | 'fail'. Inside the Claude preview, files go through the viewer's save prompt. */
async function download(name, text, type) {
  if (framed) {
    try { const d = window.claude && window.claude.use ? await window.claude.use('downloads') : null; if (!d) return 'fail'; await d.save({ filename: name, data: text }); return 'saved'; }
    catch (e) { return e && e.code === 'declined' ? 'declined' : 'fail'; }
  }
  try { const b = new Blob([text], { type }), u = URL.createObjectURL(b), a = document.createElement('a'); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 3000); return 'saved'; } catch (e) { return 'fail'; }
}
const backupText = () => JSON.stringify({ ...S, exported: new Date().toISOString() });
function csvText() {
  const q = v => { const s = String(v ?? ''); return /[",\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [['Date', 'Workout', 'Exercise', 'Muscle Group', 'Set #', 'Reps', `Weight (${U()})`, `Est. 1RM (${U()})`, 'RPE', 'Notes']];
  for (const s of [...S.sessions].sort(cmpS)) for (const e of s.ex) e.sets.forEach((t, j) => rows.push([s.date, s.name, EX(e.ex).n, EX(e.ex).m, j + 1, t.r, r1(toD(t.w || 0)), r1(toD(e1(t.w, t.r))), t.rpe ?? '', j === 0 ? e.note : '']));
  return '\uFEFF' + rows.map(r => r.map(q).join(',')).join('\r\n');

/* demo data: five weeks of the default split with steady progress */
const DEMO = { 'barbell-bench-press': 70, 'dumbbell-bench-press': 26, 'incline-dumbbell-press': 22, 'machine-chest-press': 55, 'cable-fly': 12.5, deadlift: 120, 'pull-ups': 0, 'barbell-row': 60, 'lat-pulldown': 55, 'seated-cable-row': 55, 'back-squat': 90, 'romanian-deadlift': 80, 'leg-press': 140, 'leg-curl': 40, 'standing-calf-raise': 60, 'overhead-press': 45, 'dumbbell-shoulder-press': 18, 'lateral-raise': 8, 'rear-delt-fly': 7, shrugs: 30, 'barbell-curl': 30, 'close-grip-bench-press': 60, 'hammer-curl': 14, 'tricep-pushdown': 25, 'hanging-leg-raise': 0 };
function addDemo() {
  const t = iso(), start = addDays(monday(t), -35); let seed = 11; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let w = 0; w < 6; w++) for (let d = 0; d < 7; d++) {
    const date = addDays(start, w * 7 + d); if (date >= t) continue;
    const r = routineById(S.sched[d]); if (!r || rnd() < 0.1) continue;
    const st = pd(date).getTime() + (17.5 + rnd() * 2) * 36e5;
    const s = { id: uid('s'), name: r.name, routine: r.id, date, start: st, end: st + (48 + rnd() * 25) * 6e4, demo: true, ex: [] };
    for (const it of r.items) {
      const b = DEMO[it.ex]; if (b === undefined) continue;
      const step = b >= 40 ? 2.5 : b >= 10 ? 1 : 0.5, wt = b ? b + step * Math.floor(w * 0.85 + rnd() * 0.5) : 0;
      s.ex.push({ ex: it.ex, note: '', sets: Array.from({ length: it.s }, (_, k) => ({ w: wt, r: b ? Math.max(it.lo, it.hi - k - (w % 2)) : Math.max(3, 6 + w - k), rpe: null, done: true })) });
    }
    S.sessions.push(s);
  }
  for (let k = 42; k >= 1; k--) { const d = addDays(t, -k); if (rnd() < 0.3 || S.bw.some(x => x.d === d)) continue; S.bw.push({ d, kg: Math.round((77.9 + k / 42 * 1.5 + (rnd() - 0.5) * 0.8) * 10) / 10, demo: true }); }

}

function bind() {
  document.addEventListener('click', ev => {
    const tab = ev.target.closest('[data-tab]'); if (tab) { go(tab.dataset.tab); return; }
    const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
    const f = ACT[b.dataset.act]; if (f) { ev.preventDefault(); f(b, ev); }
  });
  document.addEventListener('input', ev => {
    const t = ev.target;
    if (t.matches('#wo-list .numi')) {
      const row = t.closest('.row'), set = S.active.ex[+row.dataset.i].sets[+row.dataset.j], v = pnum(t.value), f = t.dataset.f;
      set[f] = v == null ? null : f === 'w' ? toKg(v) : f === 'r' ? Math.round(v) : Math.min(10, v);
      saveSoon(); return;
    }
    if (t.id === 'wo-name') { S.active.name = t.value; saveSoon(); return; }
    if (t.dataset.rd === 'name') { RD.name = t.value; return; }
    if (t.dataset.rdi) { RD.items[+t.dataset.k][t.dataset.rdi] = parseInt(t.value, 10) || 0; }
  });
  document.addEventListener('change', ev => {
    const t = ev.target;
    if (t.id === 'imp-file' && t.files && t.files[0]) { t.files[0].text().then(importText, () => toast('Could not read that file')); t.value = ''; return; }
    const c = t.dataset.chg;
    if (c === 'pex') { pEx = t.value; renderView(); }
    if (c === 'set-rest') { S.rest = +t.value; save(); }
    if (c === 'set-inc') { S.inc[S.unit] = +t.value; save(); if (woOpen()) renderWO(); }
  });
  document.addEventListener('focusin', ev => { if (ev.target.matches('.numi')) setTimeout(() => { try { ev.target.select(); } catch (e) { } }, 0); });
  document.addEventListener('keydown', ev => {
    if (ev.key !== 'Enter') return; const t = ev.target;
    if (t.matches('#wo-list .numi')) {
      ev.preventDefault(); const row = t.closest('.row');
      const next = t.dataset.f === 'w' ? row.querySelector('[data-f="r"]') : t.dataset.f === 'r' && S.rpe ? row.querySelector('[data-f="rpe"]') : null;
      if (next) next.focus(); else if (!S.active.ex[+row.dataset.i].sets[+row.dataset.j].done) tick(+row.dataset.i, +row.dataset.j); else t.blur();
    }
    if (t.id === 'bw-in') ACT['bw-log']();
    if (t.id === 'bw-in2') ACT['bw-log2']();
    if (t.id === 'wo-name') t.blur();
  });
  window.addEventListener('hashchange', route);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && woOpen()) { lockScreen(); renderRest(); woClock(); } if (!document.hidden && !woOpen() && view === 'today') renderView(); });
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); dip = e; refreshSettings(); });
  window.addEventListener('appinstalled', () => { dip = null; toast('IronLog installed'); });
  setInterval(() => { if (woOpen()) woClock(); }, 1000);
}

function init() {
  load();
  if (!S.seen && !S.sessions.length) { /* first run */ }
  bind();
  if (S.active && S.active.rest && S.active.rest.end > Date.now()) { R.end = S.active.rest.end; R.total = S.active.rest.total; loopRest(); }
  route();
  if (!S.seen) welcome();
  if ('serviceWorker' in navigator && !framed && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
}
init();

}
</script>
